name: Auto Deploy Laravel

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /var/www/laravel-antrian

    steps:
      - name: Pull latest code
        run: git pull origin main

      - name: Maintenance Mode (Down)
        run: php artisan down --render="errors::503" || true

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build frontend (Vite)
        run: |
          npm install
          npm run build

      - name: Laravel setup
        run: |
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Restart Reverb (WebSocket)
        run: php artisan reverb:restart || true

      - name: Fix Permissions (no sudo)
        run: |
          chmod -R 775 storage bootstrap/cache

      - name: Maintenance Mode (Up)
        if: always()
        run: php artisan up
